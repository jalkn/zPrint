<svg xmlns="http://www.w3.org/2000/svg" id="zprint-studio-logo" viewBox="0 0 880 564" width="880" height="564" role="img" aria-labelledby="zprint-title zprint-desc">
  <title id="zprint-title">ZPRINT STUDIO — Brand Symbol</title>
  <desc id="zprint-desc">
    Modular geometric ZPRINT STUDIO logomark composed of three independent proportional parallelograms (Top 2W x 2H, Middle Master Unit 1W x 1H, Bottom 3W x 2H) sharing a constant slant angle in an electric cyan and blue gradient palette.
  </desc>

  <defs>
    
    <linearGradient id="zprint-grad-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="55%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    
    <linearGradient id="zprint-grad-middle" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0038D6" />
      <stop offset="100%" stop-color="#002299" />
    </linearGradient>

    
    <linearGradient id="zprint-grad-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="48%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#0095FF" />
    </linearGradient>
  </defs>

  
  <g id="zprint-symbol" fill-rule="nonzero">
    
    <g id="zprint-layer-top">
      <polygon id="zprint-parallelogram-top" points="460,20 860,20 620,220 220,220" fill="url(#zprint-grad-top)" />
    </g>

    
    <g id="zprint-layer-middle">
      <polygon id="zprint-parallelogram-middle" points="400,232 600,232 480,332 280,332" fill="url(#zprint-grad-middle)" />
    </g>

    
    <g id="zprint-layer-bottom">
      <polygon id="zprint-parallelogram-bottom" points="260,344 860,344 620,544 20,544" fill="url(#zprint-grad-bottom)" />
    </g>
  </g>
</svg>